name: Build and push Docker image

# Builds the Quanta CMS base image (Dockerfile at the repo root), TESTS it, and
# pushes it to the GitHub Container Registry (ghcr.io/quantacms/quanta).
#
# The build context is the repo root so qdb/ is reachable for the Rust
# extension stage. Pull requests build and test only; pushes to master, version
# tags, and manual runs also push the image.
#
# ── Multi-arch ────────────────────────────────────────────────────────────────
# The image is published for linux/amd64 AND linux/arm64 under one tag (a
# manifest list), so a downstream image can `FROM` it on either architecture
# and get a native build. Without the arm64 variant a build on an Apple-silicon
# laptop silently mixes architectures: a multi-stage downstream Dockerfile
# compiles its own extensions in an arm64 builder stage (official php images
# are multi-arch), then COPYs them into the only variant of this image that
# exists, amd64, where they refuse to load.
#
# Each architecture is built on a runner of that architecture (GitHub hosts
# arm64 runners for public repos), not under QEMU: the Rust compile with LTO
# would take the better part of an hour emulated, and `load: true` — which the
# test steps need — cannot load a multi-platform result into the daemon anyway.
# So the matrix below builds, tests and pushes each architecture BY DIGEST, and
# the `manifest` job stitches the digests into the final tags. The per-platform
# GHA cache scopes keep the two architectures from evicting each other's layers.
#
# ── Testing ───────────────────────────────────────────────────────────────────
# On each runner the image is built once with load:true, both test suites run
# against that exact image, and only then is it pushed — so a red suite on
# either architecture cannot publish a tag. The push step rebuilds from the same
# GHA layer cache, which is a cache hit for every layer, so it costs a push and
# not a second Rust compile.
#
# Two suites run, and they answer different questions:
#
#   qdb/tests/run-tests.sh        does the EXTENSION obey the contract?
#                                      (fallback + daemon modes)
#   qdb/tests/run-quanta-tests.sh does QUANTA behave the same with the
#                                      extension and without it?
#                                      (noext + fallback + daemon modes)
#
# The second is the one that guards the shim: every call site wired to the node
# database keeps a legacy path, and the suite pins both branches to the same
# observable behaviour. See qdb/tests/quanta/_bootstrap.php.
#
# Running both suites on arm64 as well is not incidental: qdb mirrors PHP's
# string hash, whose byte accumulation depends on the target's `char`
# signedness (qdb/src/php_abi.rs), and this is where that branch gets exercised.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      # "linux/amd64" -> "linux-amd64": artifact names cannot contain a slash.
      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we actually push (skipped for pull_request events,
      # which have a read-only token and no push access to the registry).
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only, here: the tags are applied to the manifest list by the
      # `manifest` job, the per-arch images are pushed by digest.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build into the local docker daemon so the suites below run against the
      # very image that will be pushed.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: quanta-ci:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false

      # The image drops qdb/ from the web root (see the Dockerfile), so the
      # suites are mounted in from the checkout rather than read out of it. The
      # entrypoint is bypassed: it does first-boot site setup and starts
      # supervisord, neither of which a test run wants.
      - name: qdb contract conformance (fallback + daemon)
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/qdb/tests:/tests:ro" \
            quanta-ci:test \
            -c 'QDB_EXT=/usr/local/lib/php/extensions/quanta_db.so sh /tests/run-tests.sh'

      - name: Quanta call-site parity (noext + fallback + daemon)
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/qdb/tests:/tests:ro" \
            quanta-ci:test \
            -c 'QUANTA_ROOT=/var/www/quanta sh /tests/run-quanta-tests.sh'

      # Every layer is a cache hit from the build above, so this is a push, not
      # a rebuild. Pushed by digest only (no tag): the tags go on the manifest
      # list that the `manifest` job assembles from both architectures.
      - name: Push image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false

      # The digest travels to the manifest job as an empty file named after it.
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-architecture images into one manifest list per tag. Only
  # runs when every architecture built, tested and pushed — a failure on either
  # runner leaves the existing tags untouched.
  manifest:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest list
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
