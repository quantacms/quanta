name: Build and push Docker image

# Builds the Quanta CMS base image (Dockerfile at the repo root), TESTS it, and
# pushes it to the GitHub Container Registry (ghcr.io/quantacms/quanta).
#
# The build context is the repo root so qdb/ is reachable for the Rust
# extension stage. Pull requests build and test only; pushes to master, version
# tags, and manual runs also push the image.
#
# The image is built once with load:true, both test suites run against that
# exact image, and only then is it pushed — so a red suite cannot publish a
# tag. The push step rebuilds from the same GHA layer cache, which is a cache
# hit for every layer, so it costs a push and not a second Rust compile.
#
# Two suites run, and they answer different questions:
#
#   qdb/tests/run-tests.sh        does the EXTENSION obey the contract?
#                                      (fallback + daemon modes)
#   qdb/tests/run-quanta-tests.sh does QUANTA behave the same with the
#                                      extension and without it?
#                                      (noext + fallback + daemon modes)
#
# The second is the one that guards the shim: every call site wired to the node
# database keeps a legacy path, and the suite pins both branches to the same
# observable behaviour. See qdb/tests/quanta/_bootstrap.php.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we actually push (skipped for pull_request events,
      # which have a read-only token and no push access to the registry).
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local docker daemon so the suites below run against the
      # very image that will be pushed.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: quanta-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The image drops qdb/ from the web root (see the Dockerfile), so the
      # suites are mounted in from the checkout rather than read out of it. The
      # entrypoint is bypassed: it does first-boot site setup and starts
      # supervisord, neither of which a test run wants.
      - name: qdb contract conformance (fallback + daemon)
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/qdb/tests:/tests:ro" \
            quanta-ci:test \
            -c 'QDB_EXT=/usr/local/lib/php/extensions/quanta_db.so sh /tests/run-tests.sh'

      - name: Quanta call-site parity (noext + fallback + daemon)
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/qdb/tests:/tests:ro" \
            quanta-ci:test \
            -c 'QUANTA_ROOT=/var/www/quanta sh /tests/run-quanta-tests.sh'

      # Every layer is a cache hit from the build above, so this is a push, not
      # a rebuild.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
