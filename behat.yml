default:
  suites:
    default:
      paths:
        - "%paths.base%/features"
      contexts:
        - FeatureContext
        - Behat\MinkExtension\Context\MinkContext
  extensions:
    Behat\MinkExtension:
      base_url: "http://localhost:8000"
      goutte: ~
      selenium2:
        wd_host: "http://127.0.0.1:8643/wd/hub"
        capabilities:
          browser: "phantomjs"
