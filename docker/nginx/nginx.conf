# Quanta CMS — nginx main configuration.
#
# Replaces the Apache setup that used to live in the base image. The per-site
# rewrite map that .htaccess encoded is in conf.d/default.conf (quanta.conf);
# this file only carries process-wide tuning, logging and the cache zones.

user  www-data;
worker_processes  auto;
pid /run/nginx.pid;

# Keep the worker fd limit above open_file_cache max + connections.
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 128m;

    # Site content is reached through per-host symlinks under sites/ (see the
    # Environment docroot layout), so symlink following must stay enabled.
    disable_symlinks off;

    # JSON access log to stdout — replaces the JSON LogFormat the downstream
    # app image used to layer on top of Apache.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"host":"$host",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"cache":"$upstream_cache_status"'
    '}';

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    # Text types only — images and fonts are already compressed.
    gzip_types
        text/plain text/css text/xml text/javascript text/vtt
        application/javascript application/x-javascript application/json
        application/ld+json application/xml application/xhtml+xml
        application/rss+xml application/atom+xml application/manifest+json
        image/svg+xml;

    # Metadata cache for the directly-mapped static paths (/assets, /files,
    # /thumbs, ...): avoids a stat() per request on hot files.
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # QASSETS: node-attached files (images, pdfs, ...). These are rendered by
    # PHP (FileFactory::checkFile -> readfile), so caching them removes a full
    # boot.php cycle per hit. Long TTL, large on-disk budget.
    fastcgi_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=QASSETS:32m
                       max_size=2g inactive=7d use_temp_path=off;

    # QHTML: anonymous page-render micro-cache. Short TTL — it exists to absorb
    # bursts, not to serve stale content.
    fastcgi_cache_path /var/cache/nginx/html levels=1:2 keys_zone=QHTML:16m
                       max_size=256m inactive=10m use_temp_path=off;

    # Large images must not spill to temp files on their way out of php-fpm.
    fastcgi_buffers 32 32k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_read_timeout 120s;

    include /etc/nginx/conf.d/*.conf;
}
