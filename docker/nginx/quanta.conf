# Quanta CMS vhost — the nginx equivalent of the repo's .htaccess.
#
# The .htaccess rewrite map is reproduced here one-for-one:
#
#   /favicon.ico|png              301 -> /assets/img/favicon.*
#   /.well-known/acme-challenge/* ->  acme-challenge/*
#   /css/<name>.css              ->  sites/$host/files/css/<name>.css
#   /js/<name>.js                ->  sites/$host/files/js/<name>.js
#   /files/*                     ->  sites/$host/files/*
#   /assets/*                    ->  sites/$host/assets/*
#   /thumbs/*                    ->  static/tmp/$host/thumbs/*
#   /tmp/*                       ->  static/tmp/$host/files/*
#   /modules/*                   ->  src/modules/*
#   extensionless, no trailing / 301 -> same + "/"
#   existing .php/.inc/.json/... 301 -> /403
#   everything else              ->  src/boot.php
#
# On top of that it adds the caching Apache never did: node-attached files
# (which PHP serves via FileFactory::checkFile -> readfile) are stored in the
# QASSETS fastcgi cache, and anonymous HTML renders get a QHTML micro-cache.

# Anonymous == no PHP session cookie. Logged-in users must never be served, or
# populate, a cached page.
map $http_cookie $has_session {
    default    0;
    "~*PHPSESSID"  1;
}

map $request_method $is_write {
    default  1;
    GET      0;
    HEAD     0;
}

# A Bearer/Basic credential authenticates a caller *without* a PHP session
# cookie (the API modules read $_SERVER['HTTP_AUTHORIZATION'] directly). The
# cache key is only "$host$request_uri", so caching such a response would serve
# an authenticated body to the next anonymous caller — never cache them.
map $http_authorization $has_auth {
    default  1;
    ""       0;
}

# Query strings carry actions/ajax (Environment::checkActions), so they bypass
# the HTML cache as well.
map "$has_session$is_write$has_auth$is_args" $skip_html {
    default  1;
    "000"    0;
}

# Media has no session to vary on, but the credential rule applies just the
# same, as does the ?download= variant.
map "$has_auth$is_args" $skip_media {
    default  1;
    "0"      0;
}

# Last path segment has no dot and the URI has no trailing slash -> Quanta
# wants the canonical trailing-slash form.
map $uri $needs_slash {
    default              0;
    "~^/(?:.*/)?[^/.]+$" 1;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /var/www/quanta;
    index src/boot.php;
    autoindex off;

    # Emit path-only Location headers. nginx would otherwise expand a relative
    # redirect to $scheme://$host/... — and behind a TLS-terminating ingress
    # $scheme is "http", so every trailing-slash / favicon / 403 redirect would
    # downgrade the client out of https.
    absolute_redirect off;

    # .env and friends are never web-content (see the snippet). Repeated inside
    # the ^~ locations below, which skip regex matching.
    include /etc/nginx/snippets/deny-dotfiles.conf;

    # ── Health probe ────────────────────────────────────────────────────────
    # Static, so k8s startup/liveness/readiness probes cost nothing and work
    # during the slow boot sequence before the app can render. Note this proves
    # only that nginx is up — see docker/supervisord.conf for what keeps
    # php-fpm alive behind it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ── Favicons ────────────────────────────────────────────────────────────
    location = /favicon.ico { return 301 /assets/img/favicon.ico; }
    location = /favicon.png { return 301 /assets/img/favicon.png; }

    # ── LetsEncrypt ─────────────────────────────────────────────────────────
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/quanta/acme-challenge/;
        access_log off;
    }

    # ── Directly-mapped static paths ────────────────────────────────────────
    # Served straight off disk by nginx (open_file_cache keeps the stat() cost
    # off the hot path); no PHP involved, so no fastcgi cache is needed.

    # CSS/JS are name-versioned by the cache module -> immutable.
    location ^~ /css/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        alias /var/www/quanta/sites/$host/files/css/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
    }

    location ^~ /js/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        alias /var/www/quanta/sites/$host/files/js/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
    }

    location ^~ /files/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        alias /var/www/quanta/sites/$host/files/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        alias /var/www/quanta/sites/$host/assets/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ^~ /thumbs/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        alias /var/www/quanta/static/tmp/$host/thumbs/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ^~ /tmp/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        alias /var/www/quanta/static/tmp/$host/files/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Module assets (js/css/images shipped by src/modules/*). The nested deny
    # keeps module PHP sources unreachable, as .htaccess did.
    location ^~ /modules/ {
        alias /var/www/quanta/src/modules/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;

        location ~ \.(?:php|inc|json|conf|lock|gitignore|htaccess)$ {
            return 301 /403;
        }
        include /etc/nginx/snippets/deny-dotfiles.conf;
    }

    # ── Sensitive extensions ────────────────────────────────────────────────
    # .htaccess 403'd these only when they resolved to a real file on disk
    # (composer.json, secrets.php, ...). A .json/.inc *inside a node* is not a
    # real file at that path and is still rendered by FileFactory, so keep the
    # -f guard rather than blanket-denying.
    location ~ \.(?:php|inc|json|conf|lock|gitignore|htaccess)$ {
        if (-f $request_filename) {
            return 301 /403;
        }
        include /etc/nginx/snippets/quanta-boot.conf;
    }

    location = /doctor      { return 301 /403; }

    # ── Node-attached media ─────────────────────────────────────────────────
    # A real file at this path is served by nginx; anything else is a node
    # attachment that only PHP can resolve (Cache::getStoredNodePath) — those
    # go through the long-lived QASSETS cache so the boot.php cycle happens
    # once per file, not once per request.
    location ~* \.(?:jpe?g|png|gif|webp|svg|ico|bmp|pdf|mp4|webm|ogg|oga|mp3|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri @quanta_media;
    }

    location @quanta_media {
        # Downloads (?download=1) send their own Content-Disposition and
        # `Cache-Control: private` — those responses must keep their headers
        # intact, so they are handed to the uncached passthrough instead, as is
        # anything carrying a credential.
        recursive_error_pages on;
        error_page 418 = @quanta_passthru;
        if ($skip_media) { return 418; }

        include /etc/nginx/snippets/quanta-boot.conf;
        include /etc/nginx/snippets/quanta-cacheable.conf;

        fastcgi_cache            QASSETS;
        fastcgi_cache_key        "$host$request_uri";
        fastcgi_cache_valid      200 30d;
        fastcgi_cache_valid      404 1m;
        fastcgi_cache_background_update on;

        add_header X-Quanta-Cache $upstream_cache_status always;
        add_header Cache-Control  "public, max-age=2592000" always;
    }

    # ── Pages ───────────────────────────────────────────────────────────────
    location / {
        if ($needs_slash) {
            return 301 $uri/$is_args$args;
        }
        try_files $uri @quanta;
    }

    location @quanta {
        # Anything that can carry per-user state (a session cookie, a write, a
        # query string) goes to the passthrough with its Set-Cookie and
        # no-cache headers intact. Only plain anonymous GETs reach the cache.
        recursive_error_pages on;
        error_page 418 = @quanta_passthru;
        if ($skip_html) { return 418; }

        include /etc/nginx/snippets/quanta-boot.conf;
        include /etc/nginx/snippets/quanta-cacheable.conf;

        fastcgi_cache        QHTML;
        fastcgi_cache_key    "$host$request_uri";
        fastcgi_cache_valid  200 10s;

        # The micro-cache lives in nginx, not in browsers: clients revalidate
        # every time and hit the shared 10s entry.
        add_header Cache-Control  "public, max-age=0, must-revalidate" always;
        add_header X-Quanta-Cache $upstream_cache_status always;
    }

    # Uncached render: full fidelity, every PHP header (Set-Cookie,
    # Content-Disposition, Cache-Control) passed through untouched.
    location @quanta_passthru {
        include /etc/nginx/snippets/quanta-boot.conf;
        add_header X-Quanta-Cache "BYPASS" always;
    }
}
