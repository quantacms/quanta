# Quanta CMS vhost — the nginx equivalent of the repo's .htaccess.
#
# The .htaccess rewrite map is reproduced here one-for-one:
#
#   /favicon.ico|png              301 -> /assets/img/favicon.*
#   /.well-known/acme-challenge/* ->  acme-challenge/*
#   /css/<name>.css              ->  sites/$host/files/css/<name>.css
#   /js/<name>.js                ->  sites/$host/files/js/<name>.js
#   /files/*                     ->  sites/$host/files/*
#   /assets/*                    ->  sites/$host/assets/*
#   /thumbs/*                    ->  static/tmp/$host/thumbs/*
#   /tmp/*                       ->  static/tmp/$host/files/*
#   /modules/*                   ->  src/modules/*
#   extensionless, no trailing / 301 -> same + "/"
#   existing .php/.inc/.json/... 301 -> /403
#   everything else              ->  src/boot.php
#
# On top of that it adds the caching Apache never did: node-attached files
# (which PHP serves via FileFactory::checkFile -> readfile) are stored in the
# QASSETS fastcgi cache, and anonymous HTML renders get a QHTML micro-cache.

# Anonymous == no PHP session cookie. Logged-in users must never be served, or
# populate, a cached page.
map $http_cookie $has_session {
    default    0;
    "~*PHPSESSID"  1;
}

map $request_method $is_write {
    default  1;
    GET      0;
    HEAD     0;
}

# The verbs the app implements: boot.php serves GET/HEAD/POST, and the api
# module adds PUT/DELETE (src/modules/api/hooks/api.hook.inc). Anything else is
# a scanner.
map $request_method $bad_method {
    default  1;
    GET      0;
    HEAD     0;
    POST     0;
    PUT      0;
    DELETE   0;
}

# A Bearer/Basic credential authenticates a caller *without* a PHP session
# cookie (the API modules read $_SERVER['HTTP_AUTHORIZATION'] directly). The
# cache key is only "$host$request_uri", so caching such a response would serve
# an authenticated body to the next anonymous caller — never cache them.
map $http_authorization $has_auth {
    default  1;
    ""       0;
}

# Query strings carry actions/ajax (Environment::checkActions), so they bypass
# the HTML cache as well.
map "$has_session$is_write$has_auth$is_args" $skip_html {
    default  1;
    "000"    0;
}

# Media has no session to vary on, but the credential rule applies just the
# same, as does the ?download= variant.
map "$has_auth$is_args" $skip_media {
    default  1;
    "0"      0;
}

# Did this request come through a proxy? Traefik terminates every external
# request and re-emits it from its own pod IP, which is inside the cluster pod
# CIDR (10.42.0.0/16 on k3s) — so an RFC1918 address check on its own would let
# the entire internet reach the cluster-only endpoints below. Every proxied
# request carries X-Forwarded-For (Traefik sets it unconditionally); a scrape
# sent straight to the pod IP, or a `kubectl exec` curl, does not.
map $http_x_forwarded_for $is_proxied {
    default  1;
    ""       0;
}

# Last path segment has no dot and the URI has no trailing slash -> Quanta
# wants the canonical trailing-slash form.
map $uri $needs_slash {
    default              0;
    "~^/(?:.*/)?[^/.]+$" 1;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /var/www/quanta;
    index src/boot.php;
    autoindex off;

    # Emit path-only Location headers. nginx would otherwise expand a relative
    # redirect to $scheme://$host/... — and behind a TLS-terminating ingress
    # $scheme is "http", so every trailing-slash / favicon / 403 redirect would
    # downgrade the client out of https.
    absolute_redirect off;

    # .env and friends are never web-content, no URL in Quanta ever ends in
    # .php, and the repo's dev droppings are not web content either (see the
    # snippets). All three are repeated inside the ^~ locations below, which
    # skip regex matching.
    include /etc/nginx/snippets/deny-dotfiles.conf;
    include /etc/nginx/snippets/deny-php.conf;
    include /etc/nginx/snippets/deny-dev-files.conf;

    # Only the methods the app actually implements reach PHP. api.hook.inc
    # switches on GET/POST/PUT/DELETE and nothing in the tree emits CORS
    # headers, so OPTIONS is unused too — every other verb (PATCH, PROPFIND,
    # MKCOL, the WebDAV set scanners like to probe with) would otherwise cost a
    # full boot.php render to produce a 404.
    if ($bad_method) {
        return 405;
    }

    # ── Health probe ────────────────────────────────────────────────────────
    # Static, so k8s startup/liveness/readiness probes cost nothing and work
    # during the slow boot sequence before the app can render. Note this proves
    # only that nginx is up — see docker/supervisord.conf for what keeps
    # php-fpm alive behind it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ── Deep health: php-fpm ────────────────────────────────────────────────
    # /healthz proves only that nginx is up, so a pod whose data layer is dead
    # still reports Ready. These reach php-fpm's own ping/status handlers -- no
    # application code, so they stay fast and honest while the app itself is
    # degraded.
    #
    # For scraping and alerting, not for kubelet: ping is served by a worker, so
    # it queues when the pool saturates, and a liveness probe here would restart
    # the pod precisely when a slow data layer is already hurting.
    #
    # Cluster-only, and it takes both guards to mean that: $is_proxied rejects
    # anything that arrived through the ingress (whose own pod IP would pass the
    # address list), and the address list keeps the endpoints off anything that
    # reaches the pod directly from outside the cluster network. The status page
    # lists every worker's current URI, so this is a disclosure boundary, not a
    # tidiness one.
    #
    # All THREE fastcgi_param overrides below are load-bearing, and the URL
    # nginx serves them at (/healthz/...) is deliberately not the URL php-fpm
    # matches on (/fpm-...), so the pool paths cannot be reached under any other
    # location. What php-fpm does with an incoming request, in order:
    #
    #   1. SCRIPT_FILENAME becomes path_translated; if it is *absent* the
    #      request is answered "File not found." (404) immediately — before any
    #      ping/status handling. The stock /etc/nginx/fastcgi_params sets
    #      SCRIPT_NAME but never SCRIPT_FILENAME (quanta-boot.conf adds it
    #      itself), so it must be set here. Empty is the right value: it is
    #      present, so the 404 gate passes, and it never names a script.
    #   2. ping.path / pm.status_path are compared against REQUEST_URI, not
    #      SCRIPT_NAME — and fastcgi_params sets REQUEST_URI to the *original*
    #      URI, /healthz/fpm, which matches neither.
    #   3. only then is the script opened, which is why nothing here executes
    #      application code and why both stay honest while the app is degraded.
    #
    # `include fastcgi_params` therefore comes FIRST, so these overrides win.
    # Drop any one of them and the endpoint answers "File not found." while
    # `nginx -t` and `php-fpm -t` both still pass — syntax checks cannot prove
    # this block works. Only an end-to-end request can: it must answer `pong`.
    location = /healthz/fpm {
        access_log off;
        if ($is_proxied) { return 403; }
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME     /fpm-ping;
        fastcgi_param REQUEST_URI     /fpm-ping;
        fastcgi_param SCRIPT_FILENAME "";
        fastcgi_read_timeout 2s;
    }

    # QUERY_STRING carries the status page's ?json / ?full / ?full&json forms and
    # already comes from fastcgi_params — setting it again here would send the
    # parameter twice. REQUEST_URI is pinned without the query string, which is
    # what pm.status_path is matched against.
    location = /healthz/fpm-status {
        access_log off;
        if ($is_proxied) { return 403; }
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        fastcgi_pass unix:/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME     /fpm-status;
        fastcgi_param REQUEST_URI     /fpm-status;
        fastcgi_param SCRIPT_FILENAME "";
        fastcgi_read_timeout 2s;
    }

    # ── Favicons ────────────────────────────────────────────────────────────
    location = /favicon.ico { return 301 /assets/img/favicon.ico; }
    location = /favicon.png { return 301 /assets/img/favicon.png; }

    # ── LetsEncrypt ─────────────────────────────────────────────────────────
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/quanta/acme-challenge/;
        access_log off;
    }

    # ── Internal-only paths ─────────────────────────────────────────────────
    # These are filesystem locations that happen to sit under the web root
    # because the image is built with `COPY . /var/www/quanta/`. None of them is
    # a URL: nothing in src/ or profiles/ emits a link to any of them.
    #
    # /sites/ and /static/ matter most. Site content is *meant* to be reached
    # through the $host-scoped aliases above (/files/, /assets/, /thumbs/,
    # /tmp/); the raw paths walk around that scoping, so any vhost could read
    # any other tenant's tree — including sites/<host>/db/_users/, where the
    # user records with their password hashes live (Environment::dir['users']).
    # Apache served these too (`RewriteCond %{REQUEST_FILENAME} -f`), so this
    # closes a hole rather than restoring old behaviour.
    #
    # /vendor/ leaks the exact dependency set through the changelogs and
    # metadata composer ships next to the code — a free CVE shopping list.
    location ^~ /sites/    { return 403; }
    location ^~ /static/   { return 403; }
    location ^~ /vendor/   { return 403; }
    location ^~ /tests/    { return 403; }
    location ^~ /profiles/ { return 403; }

    # src/ is the exception: /modules/ (aliased above) is the canonical URL for
    # module assets, but three qtags hardcode the src/ form — Captcha.qtag.php
    # and Carousel.qtag.php pass '/src/modules/<mod>/assets/js/*.js' to
    # addJS(..., 'file'), which emits it verbatim as a <script src>. So the
    # assets subtree stays public and everything else under src/ — templates,
    # hooks, class sources — is denied.
    location ^~ /src/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;

        location ~ ^/src/modules/[^/]+/assets/ {
            expires 30d;
            add_header Cache-Control "public" always;
            access_log off;
        }

        return 403;
    }

    # ── Directly-mapped static paths ────────────────────────────────────────
    # Served straight off disk by nginx (open_file_cache keeps the stat() cost
    # off the hot path); no PHP involved, so no fastcgi cache is needed.

    # CSS/JS are name-versioned by the cache module -> immutable.
    location ^~ /css/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;
        alias /var/www/quanta/sites/$host/files/css/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
    }

    location ^~ /js/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;
        alias /var/www/quanta/sites/$host/files/js/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        access_log off;
    }

    location ^~ /files/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;
        alias /var/www/quanta/sites/$host/files/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;
        alias /var/www/quanta/sites/$host/assets/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ^~ /thumbs/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;
        alias /var/www/quanta/static/tmp/$host/thumbs/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ^~ /tmp/ {
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;
        alias /var/www/quanta/static/tmp/$host/files/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # Module assets (js/css/images shipped by src/modules/*). The nested denies
    # keep module sources — .class.php above all — unreachable, as .htaccess did.
    location ^~ /modules/ {
        alias /var/www/quanta/src/modules/;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;

        location ~ \.(?:inc|json|conf|lock|gitignore|htaccess)$ {
            return 301 /403;
        }
        include /etc/nginx/snippets/deny-dotfiles.conf;
        include /etc/nginx/snippets/deny-php.conf;
        include /etc/nginx/snippets/deny-dev-files.conf;
    }

    # ── Sensitive extensions ────────────────────────────────────────────────
    # .htaccess 403'd these only when they resolved to a real file on disk
    # (composer.json, config.inc, ...). A .json/.inc *inside a node* is not a
    # real file at that path and is still rendered by FileFactory, so keep the
    # -f guard rather than blanket-denying. .php is the exception and is denied
    # outright a few lines up — see snippets/deny-php.conf.
    #
    # Archives are here for the same reason: a .zip attached to a node is a
    # normal download and must keep working, while a backup.zip that really is
    # sitting in the tree is not something to hand out.
    location ~ \.(?:inc|json|conf|lock|gitignore|htaccess|zip|tar|gz|tgz|bz2|xz|7z|rar)$ {
        if (-f $request_filename) {
            return 301 /403;
        }
        include /etc/nginx/snippets/quanta-boot.conf;
    }

    location = /doctor      { return 301 /403; }

    # ── Node-attached media ─────────────────────────────────────────────────
    # A real file at this path is served by nginx; anything else is a node
    # attachment that only PHP can resolve (Cache::getStoredNodePath) — those
    # go through the long-lived QASSETS cache so the boot.php cycle happens
    # once per file, not once per request.
    location ~* \.(?:jpe?g|png|gif|webp|svg|ico|bmp|pdf|mp4|webm|ogg|oga|mp3|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri @quanta_media;
    }

    location @quanta_media {
        # Downloads (?download=1) send their own Content-Disposition and
        # `Cache-Control: private` — those responses must keep their headers
        # intact, so they are handed to the uncached passthrough instead, as is
        # anything carrying a credential.
        recursive_error_pages on;
        error_page 418 = @quanta_passthru;
        if ($skip_media) { return 418; }

        include /etc/nginx/snippets/quanta-boot.conf;
        include /etc/nginx/snippets/quanta-cacheable.conf;

        fastcgi_cache            QASSETS;
        fastcgi_cache_key        "$host$request_uri";
        fastcgi_cache_valid      200 30d;
        fastcgi_cache_valid      404 1m;
        fastcgi_cache_background_update on;

        add_header X-Quanta-Cache $upstream_cache_status always;
        add_header Cache-Control  "public, max-age=2592000" always;
    }

    # ── Pages ───────────────────────────────────────────────────────────────
    location / {
        if ($needs_slash) {
            return 301 $uri/$is_args$args;
        }
        try_files $uri @quanta;
    }

    location @quanta {
        # Anything that can carry per-user state (a session cookie, a write, a
        # query string) goes to the passthrough with its Set-Cookie and
        # no-cache headers intact. Only plain anonymous GETs reach the cache.
        recursive_error_pages on;
        error_page 418 = @quanta_passthru;
        if ($skip_html) { return 418; }

        include /etc/nginx/snippets/quanta-boot.conf;
        include /etc/nginx/snippets/quanta-cacheable.conf;

        fastcgi_cache        QHTML;
        fastcgi_cache_key    "$host$request_uri";
        fastcgi_cache_valid  200 10s;

        # The micro-cache lives in nginx, not in browsers: clients revalidate
        # every time and hit the shared 10s entry.
        add_header Cache-Control  "public, max-age=0, must-revalidate" always;
        add_header X-Quanta-Cache $upstream_cache_status always;
    }

    # Uncached render: full fidelity, every PHP header (Set-Cookie,
    # Content-Disposition, Cache-Control) passed through untouched.
    location @quanta_passthru {
        include /etc/nginx/snippets/quanta-boot.conf;
        add_header X-Quanta-Cache "BYPASS" always;
    }
}
