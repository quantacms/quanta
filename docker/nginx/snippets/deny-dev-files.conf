# Deny build/dev/ops droppings by extension.
#
# `COPY . /var/www/quanta/` (Dockerfile) makes the whole repo the web root, and
# the user-writable content dirs (sites/$host/files/, static/tmp/) collect
# whatever an editor or a careless upload leaves behind. Nothing here is ever
# legitimate web content.
#
# Deliberately NOT in this list:
#
#   .txt  — robots.txt is rendered by PHP (page.hook.inc `robots.txt` branch).
#   .xml  — feeds and sitemaps.
#   .zip/.tar/.gz/... — node attachments are a supported download; those are
#           handled by the -f-guarded rule in quanta.conf instead, so a real
#           archive sitting on disk is denied while a node attachment is not.
#
# Note this runs *before* try_files, so it also denies a node attachment
# carrying one of these extensions. That is the intent for .sql/.log/.pem, and
# worth knowing for .md and .key (Keynote) if a site ever attaches one.
#
# Included inside the ^~ prefix locations as well — they skip regex matching,
# and they are exactly the dirs users can write to.

location ~* (?:\.(?:md|markdown|ya?ml|toml|neon|ini|dist|sample|sh|bash|zsh|log|sql|sqlite3?|bak|orig|save|old|swp|swo|rej|patch|diff|pem|key|crt|csr|p12|pfx)|~)$ {
    access_log off;
    return 403;
}
