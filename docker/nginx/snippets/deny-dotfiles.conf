# Deny dotfiles: .env above all, but also .git, editor droppings, etc.
#
# This is the nginx equivalent of the `<FilesMatch "^\.env">` guard sites had to
# add to their own vhost — .htaccess never covered it, so it was easy to miss.
# Kept as a snippet because the ^~ prefix locations (/assets/, /files/, ...)
# skip regex matching entirely, so a server-level rule alone would not protect
# the user-writable content dirs.
#
# /.well-known/acme-challenge/ is a ^~ prefix match and therefore wins over this
# regex — LetsEncrypt keeps working.

location ~ /\. {
    return 403;
}
