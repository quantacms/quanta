# Block every *.php request, unconditionally.
#
# Nothing in Quanta is ever addressed by a .php URL: quanta-boot.conf pins
# SCRIPT_FILENAME to src/boot.php for *every* request, so the front controller
# is reached through the URI the node lives at, never through "/src/boot.php".
# That makes .php purely an attack surface — source disclosure of a file that
# happens to sit under a web-served path, plus the constant background scan for
# wp-login.php / phpunit / adminer.
#
# .htaccess only 403'd these when the file existed on disk (`REQUEST_FILENAME
# -f`); here the deny is unconditional, so a probe cannot use the response to
# tell "file exists" from "file does not".
#
# Answered as a hard 403 rather than the `301 -> /403` the other sensitive
# extensions use: a redirect would turn each scanner hit into a follow-up
# request that boots PHP to render the 403 node, which is exactly the
# amplification you don't want on this traffic.
#
# Case-insensitive: ".PHP" would otherwise slip past on a case-folding volume.
# Included inside the ^~ prefix locations too, since those skip regex matching
# entirely and would happily serve a .php dropped into a user-writable dir.

location ~* \.php$ {
    access_log off;
    return 403;
}
