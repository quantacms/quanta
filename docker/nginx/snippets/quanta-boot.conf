# Hand the request to php-fpm's src/boot.php front controller.
#
# Everything Quanta needs off the request is read from $_SERVER by
# Environment::__construct() (HTTP_HOST, REQUEST_URI, DOCUMENT_ROOT), so the
# script is always boot.php regardless of the URI — the same role
# `DirectoryIndex src/boot.php` played under Apache.

fastcgi_pass unix:/run/php-fpm.sock;
include fastcgi_params;

fastcgi_param SCRIPT_FILENAME $document_root/src/boot.php;
fastcgi_param SCRIPT_NAME     /src/boot.php;
fastcgi_param PATH_INFO       $uri;

# The stock fastcgi_params omits Authorization, so inbound API auth (Bearer /
# Basic) would silently never reach PHP. This is what Apache's `CGIPassAuth On`
# did; sites read it as $_SERVER['HTTP_AUTHORIZATION'], and getallheaders()
# under FPM derives from the same variable.
fastcgi_param HTTP_AUTHORIZATION $http_authorization;
