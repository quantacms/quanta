# Make a php-fpm response storable in a fastcgi cache.
#
# boot.php always calls Environment::startSession(), so *every* response — even
# an anonymous image render — carries PHP's default session_cache_limiter
# headers (`Cache-Control: no-store, no-cache, must-revalidate`, `Pragma`,
# `Expires`) plus a `Set-Cookie: PHPSESSID`. Left alone, nginx honours them and
# never stores anything.
#
# Ignoring them is only safe where the response is genuinely anonymous, which
# is why this snippet is included solely from the locations guarded by the
# $skip_html / $is_args bypass — anything that could carry per-user state is
# routed to @quanta_passthru instead, with its headers untouched.
#
# Set-Cookie is dropped rather than stored: a cached PHPSESSID would be handed
# to every subsequent visitor. The visitor simply stays cookieless until a
# request that bypasses the cache (any POST, or any URL with a query string)
# hands them a session of their own.

fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
fastcgi_hide_header    Set-Cookie;
fastcgi_hide_header    Pragma;
fastcgi_hide_header    Expires;
# Ignoring Cache-Control only stops nginx acting on it — it would still reach
# the client. Drop it; every location that includes this snippet sets its own.
fastcgi_hide_header    Cache-Control;

fastcgi_cache_lock      on;
fastcgi_cache_use_stale updating error timeout http_500 http_503;
