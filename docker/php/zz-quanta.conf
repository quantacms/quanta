; Quanta CMS php-fpm pool overrides.
;
; Loaded after the stock www.conf and docker.conf (which already point the
; error log at /proc/self/fd/2 and enable catch_workers_output, so the
; logging.ini stderr behaviour carries over unchanged).

[www]
; nginx and php-fpm share the container — a unix socket beats TCP here.
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

user  = www-data
group = www-data

; Pool sizing. These four are a last-resort static default, NOT the operating
; values: the entrypoint runs php-fpm-autotune.sh at every start, which derives
; them from this container's own cgroup CPU and memory limits and writes
; zzy-autotune.conf -- loaded after this file, so it wins. See that script for
; the formula and the QUANTA_FPM_* knobs.
;
; They are kept here so the image is still correct if autotune is switched off
; (QUANTA_FPM_AUTOTUNE=off) or fails, but treat 32 as "some machine, somewhere".
; A single number cannot suit both a fractional-CPU container and a multi-core
; one, so whichever value sits here is wrong for someone; the derived file is
; how a deployment stops inheriting that guess.
pm = dynamic
pm.max_children      = 32
pm.start_servers     = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12

; Not autotuned: a worker recycling interval is a leak-mitigation policy, not a
; function of how big the box is.
pm.max_requests      = 500

; The quanta_db extension and qdbstat resolve their derived-data dir from
; QUANTA_DB_ROOT, which the Dockerfile sets as a container ENV. php-fpm scrubs
; the environment by default, which would hide it from PHP.
clear_env = no

; php-fpm's built-in liveness endpoints. Neither executes application code, so
; they answer while the node index is unavailable and the app is degraded --
; which is the point: they distinguish "php-fpm is dead" (pod-local, fixable by
; a restart) from "the data layer is slow" (cluster-wide, made worse by one).
;
; Deliberately NOT wired to a kubelet probe. `ping` is answered by a worker, so
; under pool saturation it queues -- exactly the condition a degraded index
; produces -- and a liveness probe on it would restart the pod at the moment
; restarts hurt most. Scrape them; alert on them; do not let kubelet kill on them.
ping.path            = /fpm-ping
ping.response        = pong
pm.status_path       = /fpm-status

; Surface slow page renders in the container logs.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 120s
