; Quanta CMS process supervision.
;
; The image runs three processes: the qdb daemon (qdbd), php-fpm and
; nginx, plus two opt-in extras (the qdbstat Prometheus exporter and the
; qdb web dashboard). Under the old
; Apache base image this was a single apache2-foreground plus a qdbd started by
; the downstream entrypoint; supervisord replaces both.
;
; All programs log to the container's stdout/stderr so `docker logs` / Loki see
; everything in one stream.

[supervisord]
nodaemon = true
user     = root
logfile  = /dev/null
logfile_maxbytes = 0
pidfile  = /run/supervisord.pid

; Enable `supervisorctl status` inside the container for debugging.
[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

; qdbd first: php-fpm degrades gracefully if the segment is not up yet, but
; starting it early keeps the very first requests off the fallback path.
[program:qdbd]
command  = /usr/local/bin/qdbd-run.sh
priority = 10
user     = www-data
autostart = true
; `unexpected` + exitcodes=0 so the QUANTA_DB_DAEMON=off opt-out (a clean exit
; 0 from the wrapper) settles in EXITED, while a real crash is restarted.
autorestart = unexpected
exitcodes = 0
; 0 so that opt-out exit is not reported as a failed start (FATAL).
startsecs = 0
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:php-fpm]
command  = /usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
priority = 20
autostart = true
autorestart = true
startsecs = 3
stopsignal = QUIT
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:nginx]
command  = /usr/sbin/nginx -g "daemon off;"
priority = 30
autostart = true
autorestart = true
startsecs = 3
stopsignal = QUIT
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

; Last, and last for a reason: it measures the other three, so it must never be
; the thing that keeps them from starting. It is also opt-in (see
; qdbstat-exporter.sh) -- with QUANTA_DB_METRICS_LISTEN unset the wrapper exits
; 0 and the program settles in EXITED, exactly as the qdbd opt-out does.
[program:qdbstat-exporter]
command  = /usr/local/bin/qdbstat-exporter.sh
priority = 40
user     = www-data
autostart = true
autorestart = unexpected
exitcodes = 0
startsecs = 0
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

; The web dashboard: a read-only browser for what the index actually holds.
; Opt-in on QUANTA_DB_DASHBOARD_LISTEN, same EXITED-when-unset shape as the
; exporter above, and last for the same reason -- it inspects the other
; programs and must never be what keeps them from starting.
;
; It serves node paths and document content, not counters, so it binds loopback
; by default; see qdbstat-dashboard.sh.
[program:qdbstat-dashboard]
command  = /usr/local/bin/qdbstat-dashboard.sh
priority = 50
user     = www-data
autostart = true
autorestart = unexpected
exitcodes = 0
startsecs = 0
stdout_logfile = /dev/stdout
stderr_logfile = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
