<!DOCTYPE html>
{VARIABLE|set=Quanta Blog:site_name}
<html lang="[LANGUAGE]">
<head>
    <meta name="theme-color" content="#ffffff">
    [META_DATA]
    [CSS|runlast]
    [CSS|runlast|refresh|external:/assets/css/style.css]
    <title>[TITLE] - {VARIABLE:site_name}</title>
</head>
<body class="blog-layout grid three-rows [BODY_CLASSES]">
    [MESSAGES]
    [HEADER|id=header:_header]
    <div class="blog-wrapper">
        <article class="blog-content">
            [MAIN|id=grid-main|class=blog-articles]
        </article>
        <aside class="blog-sidebar">
            [BLOCK:_side-first]
        </aside>
    </div>
    [FOOTER|id=footer:_footer]
    [JS|runlast]
</body>
</html>
